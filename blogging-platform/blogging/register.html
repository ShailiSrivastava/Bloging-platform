<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HashBlog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background: linear-gradient(-45deg, #ff80ab, #ffccdc, #ff99c8, #fce4ec);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1000px;
            align-items: center;
        }

        .left-section h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .left-section p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .feature {
            display: flex;
            gap: 15px;
            align-items: center;
            color: white;
        }

        .feature i {
            font-size: 24px;
            color: #5a2d3a;
        }

        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.8s ease;
        }

        .auth-form h2 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #5a2d3a;
        }

        .auth-form p {
            color: #999;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff80ab;
            box-shadow: 0 0 15px rgba(255, 128, 171, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff80ab, #ff99c8);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 128, 171, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
        }

        .form-footer a {
            color: #ff80ab;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .loading-spinner {
            display: none;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .left-section {
                display: none;
            }

            .auth-form {
                padding: 30px 20px;
            }

            .auth-form h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Join HashBlog</h1>
            <p>Share your knowledge with thousands of developers worldwide.</p>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-feather"></i>
                    <span>Write and publish amazing blogs</span>
                </div>
                <div class="feature">
                    <i class="fas fa-users"></i>
                    <span>Connect with like-minded developers</span>
                </div>
                <div class="feature">
                    <i class="fas fa-fire"></i>
                    <span>Get recognized in the dev community</span>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <span>Track your growth and engagement</span>
                </div>
            </div>
        </div>

        <div class="auth-form">
            <h2>Create Account</h2>
            <p>Join the blogging revolution</p>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Confirm Password</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="submit-btn">
                    <span class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                    <span class="btn-text">Create Account</span>
                </button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script type="module">
        import BlogAPI from './js/api.js';

        window.handleRegister = async (event) => {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const submitBtn = document.querySelector('.submit-btn');
            const spinner = document.querySelector('.loading-spinner');
            const btnText = document.querySelector('.btn-text');

            // Reset messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            // Validate
            if (password !== passwordConfirm) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Creating Account...';

            try {
                const result = await BlogAPI.register(name, email, password, passwordConfirm);

                if (result.success) {
                    successEl.textContent = 'Account created successfully! Redirecting...';
                    successEl.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'index2.html';
                    }, 2000);
                } else {
                    errorEl.textContent = result.message || 'Registration failed';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Create Account';
            }
        };
    </script>
</body>
</html>
